<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Curso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="font-sans bg-surface min-h-screen text-gray-200 p-8">

<div class="max-w-2xl mx-auto">

    <a th:href="@{/cursos}" class="text-sm text-gray-400 hover:text-white transition-colors">&larr; Voltar</a>

    <div class="bg-surface-light rounded-xl shadow-lg p-8 mt-4">

        <h1 class="text-2xl font-semibold text-white mb-6" th:text="${curso.nome()}"></h1>

        <dl class="space-y-4 mb-8">
            <div>
                <dt class="text-xs uppercase text-gray-500">Descrição</dt>
                <dd class="text-gray-200" th:text="${curso.descricao()}"></dd>
            </div>
            <div>
                <dt class="text-xs uppercase text-gray-500">Professor</dt>
                <dd class="text-gray-200" th:text="${curso.professor()}"></dd>
            </div>
            <div>
                <dt class="text-xs uppercase text-gray-500">Carga Horária</dt>
                <dd class="text-gray-200" th:text="${curso.cargaHoraria()}"></dd>
            </div>
            <div>
                <dt class="text-xs uppercase text-gray-500">Categoria</dt>
                <dd class="text-gray-200" th:text="${curso.categoria()}"></dd>
            </div>
        </dl>

        <div class="flex gap-3">
            <a th:href="@{/cursos/{id}/editar(id=${curso.id()})}"
               class="bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-lg px-4 py-2 transition-colors">
                Editar
            </a>

            <form th:action="@{/cursos/{id}/excluir(id=${curso.id()})}" method="post">
                <button type="submit"
                        class="bg-danger hover:bg-danger-dark text-white text-sm font-medium rounded-lg px-4 py-2 transition-colors">
                    Excluir
                </button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
