<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="font-sans bg-surface min-h-screen flex items-center justify-center">

<div class="bg-surface-light rounded-xl shadow-lg p-8 w-full max-w-sm">

    <h1 class="text-2xl font-semibold text-white mb-6 text-center">Entrar</h1>

    <div th:if="${erro}" class="bg-danger/20 border border-danger text-red-200 text-sm rounded-lg px-4 py-2 mb-4">
        <p th:text="${erro}"></p>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">

        <div>
            <label for="username" class="block text-sm text-gray-300 mb-1">Usuário</label>
            <input type="text" id="username" name="username" required
                   class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>

        <div>
            <label for="password" class="block text-sm text-gray-300 mb-1">Senha</label>
            <input type="password" id="password" name="password" required
                   class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>

        <button type="submit"
                class="w-full bg-primary hover:bg-primary-dark text-white font-medium rounded-lg px-4 py-2 transition-colors">
            Entrar
        </button>
    </form>
</div>

</body>
</html>
